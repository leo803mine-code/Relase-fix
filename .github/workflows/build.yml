name: Build FLR Visuals

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build.yml'

jobs:
build:
name: Build FLR Visuals JAR
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract project ZIP
    run: |
      mkdir extracted
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Upload the FLR Visuals project ZIP to the repository root."
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d extracted

  - name: Build mod
    run: |
      GRADLEW=$(find extracted -type f -name gradlew -print -quit)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew not found in project ZIP."
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew build --no-daemon

  - name: Upload FLR Visuals JAR
    uses: actions/upload-artifact@v4
    with:
      name: FLR-Visuals
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
